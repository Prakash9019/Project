version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: proximity_api

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "4000:4000"

    command: >
      sh -c "
      npx prisma migrate deploy &&
      node dist/index.js
      "

    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3